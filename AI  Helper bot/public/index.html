
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Helper Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤖 AI Helper Bot</h1>
        <p>Your personal AI assistant</p>

        <h2>What do you need today?</h2>

        <div class="buttons">
            <button onclick="getResponse('joke')">😂 Tell a Joke</button>
            <button onclick="getResponse('motivation')">💪 Motivation</button>
            <button onclick="getResponse('tip-of-the-day')">💡 Daily Tip</button>
        </div>

        <div id="result">
            Choose an option to get started!
        </div>

        <footer>Powered by Gemini AI</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
