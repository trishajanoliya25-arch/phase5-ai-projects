
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fun Facts Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="emoji">🌍✨</div>
            <h1>AI Fun Facts</h1>
            <p>Discover something amazing every day!</p>
        </header>

        <div class="fact-card">
            <div class="bulb">💡</div>
            <h2>Did You Know?</h2>

            <p id="fact">
                Click the button below to discover an amazing fact!
            </p>

            <button id="generateBtn" onclick="getFunFact()">
                ✨ Generate Fun Fact
            </button>
        </div>

        <p class="footer">Powered by Gemini AI 🤖</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
